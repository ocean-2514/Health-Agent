# Global Configuration for ElectricityHealthAgent_Integrated

# LLM / AI Models Configuration
LLM:
  # 本地模型配置 (推荐内网部署使用)
  Local:
    BaseURL: "http://localhost:11434"  # Ollama 默认地址
    APIKey: "ollama"                     # Ollama 不需要真实 Key
    ModelName: "gpt-oss:120b-cloud"              # 替换为您本地部署的模型名
    Temperature: 0.1
    Timeout: 90                           # 单次请求超时秒数 (大模型推理较慢)
    MaxRetries: 2                         # 瞬时失败 (网络/超时) 重试次数, 指数退避
    
  # 云端 API 配置 (测试使用)
  OpenAI:
    BaseURL: "https://api.openai.com/v1"
    APIKey: "YOUR_OPENAI_API_KEY"
    ModelName: "gpt-4-turbo"
    Temperature: 0.1

  # Supervisor 自控循环用的 OpenAI 兼容后端 (P1 起生效)。
  # 同一套循环既能接 Ollama (/v1) 也能接 DeepSeek 等云端 API 
  # 缺省/留空时回退到上面的 Local 配置 (BaseURL 自动补 /v1)。
  Agent:
    BaseURL: "https://api.deepseek.com/v1"   # DeepSeek 官方 OpenAI 兼容端点
    APIKey: "sk-b9d54f1f06eb451996f6d9d376d03669"           # 填入 deepseek 的 key
    ModelName: "deepseek-v4-pro"
    Temperature: 0.1
    MaxTokens: 4096                            # 单次回复上限 (诊断报告由工具产出, 这里够用)
    Timeout: 120
    MaxRetries: 3
    EffectiveWindowOverride: 0                 # >0 时强制上下文窗口 (小模型可调小); 0=按模型默认

# Database Configuration
Database:
  IoTDB:
    Host: "127.0.0.1"
    Port: "6667"
    Username: "root"
    Password: "root"
    DatabaseName: "root.sg_dev"
    FetchSize: 1000

# Defect Identification Thresholds
Defects:
  ConfidenceThreshold: 0.5
  UnknownThreshold: 0.3
  ModelWeights:
    bert: 1.0
    cnn: 1.0
    yolo: 1.0

# API Service
Server:
  Host: "0.0.0.0"
  Port: 8000
  Debug: True
